# Regenerate with: dart run flutter_native_splash:create
# The background matches the app's ground colour, so the hand-over from the
# native splash to the first Flutter frame shows no change. The app is light
# only, so dark mode gets the same splash.
flutter_native_splash:
  color: "#f4f7f3"
  image: assets/branding/splash.png

  # Android 12+ draws its own splash from the mark, inside a circle.
  android_12:
    color: "#f4f7f3"
    image: assets/branding/splash_android12.png

  android: true
  ios: true
  web: false
