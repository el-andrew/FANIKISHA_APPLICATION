name: Mobile

on:
  push:
    paths: ['mobile/**', 'api/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'api/**', '.github/workflows/mobile.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  # The whole app on Linux, against the real API and database.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fanikisha
          POSTGRES_PASSWORD: fanikisha
          POSTGRES_DB: fanikisha
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fanikisha"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://fanikisha:fanikisha@localhost:5432/fanikisha?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Start the API
        working-directory: api
        run: |
          npm ci
          npm run db:deploy
          npm run build
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - name: Integration test
        working-directory: mobile
        run: |
          flutter pub get
          xvfb-run -a flutter test integration_test -d linux \
            --dart-define=API_BASE_URL=http://localhost:3000 \
            --dart-define=SCREENSHOT_DIR=${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
