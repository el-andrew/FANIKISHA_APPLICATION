name: API

on:
  push:
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  # A "Run workflow" button in the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fanikisha
          POSTGRES_PASSWORD: fanikisha
          POSTGRES_DB: fanikisha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fanikisha"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fanikisha:fanikisha@localhost:5432/fanikisha_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-bytes
      JWT_ISSUER: fanikisha-api
      JWT_AUDIENCE: fanikisha-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
