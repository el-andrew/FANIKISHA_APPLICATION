services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fanikisha
      POSTGRES_PASSWORD: fanikisha
      POSTGRES_DB: fanikisha
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fanikisha']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
